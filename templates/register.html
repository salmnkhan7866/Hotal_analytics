{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card login-box">
  <h1>Register</h1>
  <form method="post" class="form-col">
    <div><label>Username (3+ characters)</label><input name="username" required></div>
    <div><label>Password (6+ characters)</label><input name="password" type="password" required></div>
    <button type="submit">Create account</button>
  </form>
  <p><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
